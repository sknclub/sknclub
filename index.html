<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- (วางโค้ด CSS ของคุณที่นี่ คงเดิม 100%) -->
  <style>
    /* ... (CSS ทั้งหมดเหมือนเดิม) ... */
    body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
    [v-cloak] { display: none; }
    /* เพิ่มสไตล์สำหรับ Dropdown ประวัติ */
    .history-select { background-color: #e2e8f0; color: #1e293b; border: none; font-weight: bold; border-radius: 20px; padding: 5px 15px; }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    
    <!-- (ส่วนหน้า Login คงเดิม) -->
    <div v-if="!isLoggedIn" class="..."> ... </div>

    <div v-else class="d-flex flex-column vh-100">
      
      <!-- Navbar เปลี่ยนแปลงเพิ่ม Dropdown ย้อนหลัง -->
      <nav class="bg-white border-bottom px-4 d-flex justify-content-between align-items-center flex-shrink-0 no-print" style="height: 70px;">
          <div class="d-flex align-items-center gap-2 fw-800 text-primary fs-4 tracking-tight">
            <span>SKN CLUBS</span>
          </div>

        <div class="d-flex align-items-center gap-2 gap-md-3">
          
          <!-- เมนูเลือกดูข้อมูลย้อนหลัง (เฉพาะ Admin หรือ Teacher) -->
          <select v-if="user.role !== 'student' && availableHistories.length > 0" 
                  v-model="selectedHistory" 
                  @change="loadHistoryData" 
                  class="form-select form-select-sm history-select">
            <option value="">-- เทอมปัจจุบัน ({{configObj.semester}}/{{configObj.year}}) --</option>
            <option v-for="h in availableHistories" :value="h">ประวัติ: ภาคเรียนที่ {{h}}</option>
          </select>

          <button class="btn btn-light btn-sm shadow-sm border" @click="refreshData(false)" :disabled="loading">
            <i class="fas fa-sync-alt" :class="{'fa-spin': loading}"></i> รีเฟรช
          </button>
          
          <div class="text-end d-none d-sm-block">
            <div class="fw-bold text-dark small" style="line-height: 1.2;">{{ user.name }}</div>
            <span class="badge bg-light text-primary border-0 fw-normal">{{ user.role.toUpperCase() }}</span>
          </div>
          <button @click="logout" class="btn btn-outline-danger btn-sm rounded-pill px-3 border-0 bg-danger bg-opacity-10">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </nav>

      <!-- พื้นที่เนื้อหาหลัก (Dashboard, Report ฯลฯ เหมือนเดิม 100%) -->
      <div class="flex-grow-1 overflow-auto p-3 p-md-4" style="background-color: #f8fafc;">
        <!-- ... (วางโค้ด HTML ทั้งหมดของหน้า View ต่างๆ ไว้ที่นี่) ... -->
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          // (Data คงเดิม)
          isLoggedIn: false, user: null, view: 'dashboard', loading: false,
          clubs: [], teachersList: [], config: {}, summary: null,
          availableHistories: [], // รายการประวัติอดีต
          selectedHistory: "", // เทอมอดีตที่ถูกเลือก
          configObj: { semester: '', year: '' },
          // ... (ตัวแปรอื่นๆ คงเดิม)
        }
      },
      methods: {
        // (ฟังก์ชันอื่นๆ คงเดิม)

        doLogin() {
          this.loading = true;
          google.script.run.withSuccessHandler(res => {
            this.loading = false;
            if(res.success) { 
              this.user = res.user; 
              this.isLoggedIn = true; 
              this.refreshData(); 
            }
            else Swal.fire('Error', res.message, 'error');
          }).checkLogin(this.form.user, this.form.pass);
        },

        // ฟังก์ชันอัปเดตเพื่อรองรับ History
        loadHistoryData() {
           this.refreshData(false, this.selectedHistory);
        },

        refreshData(isSilent = false, historyValue = "") {
          if (!isSilent) this.loading = true;
          
          let term = null, year = null;
          if (historyValue) {
             [term, year] = historyValue.split('/');
          }

          google.script.run
            .withFailureHandler(err => {
              this.loading = false;
              if (!isSilent) Swal.fire('Error', 'ไม่สามารถดึงข้อมูลได้: ' + err, 'error');
            })
            .withSuccessHandler(data => {
              if (!data) { this.loading = false; return; }

              this.clubs = data.clubs || []; 
              this.config = data.config || {}; 
              this.teachersList = data.teachers || [];
              this.availableHistories = data.availableHistories || [];
              
              if(data.config.adminSettings) {
                 const st = JSON.parse(data.config.adminSettings);
                 this.configObj.semester = st.semester;
                 this.configObj.year = st.academicYear;
              }

              if (this.user && this.user.role === 'admin') this.summary = data.summary;
              
              const map = {};
              this.clubs.forEach(c => { map[String(c.id)] = c; });
              this.clubMap = map;
              
              if (historyValue && !isSilent) {
                 Swal.fire({toast:true, position:'top-end', icon:'info', title:`แสดงข้อมูลประวัติปี ${historyValue}`, showConfirmButton:false, timer:2000});
              }

              this.loading = false; 
            }).getAppData(term, year);
        },

        // แก้ไขฟังก์ชันโหลดเช็คชื่อ และ รายงาน ให้ส่ง Term/Year ไปด้วย
        loadClubData(club, viewName) {
           // ... (ลอจิกเดิม)
           let term = null, year = null;
           if (this.selectedHistory) [term, year] = this.selectedHistory.split('/');

           google.script.run.withSuccessHandler(res => {
              // ... โหลดข้อมูลเช็คชื่อ
              
              if (viewName === 'report') {
                google.script.run.withSuccessHandler(reportRes => {
                   // ... โหลดข้อมูลรายงาน
                }).getSavedClubReport(club.id, term, year);
              }
           }).getClubAttendanceGrid(club.id, term, year);
        }

        // ... (วางโค้ด Methods Vue ทั้งหมดที่เหลือไว้ตรงนี้) ...

      }
    }).mount('#app');
  </script>
</body>
</html>
