<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKN • นำเข้าข้อมูลเดิม</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f1f5f9;font-family:Tahoma,sans-serif}.wrap{max-width:790px;margin:35px auto}.box{border-radius:16px;background:white;padding:30px}pre{white-space:pre-wrap;max-height:330px;overflow:auto}</style></head><body>
<main class="wrap p-3"><section class="box shadow-sm"><h3 class="text-primary">นำเข้าข้อมูลระบบชุมนุมเดิม</h3><p class="text-secondary">สำหรับผู้ดูแลระบบเท่านั้น: ใช้ไฟล์ JSON จาก <code>tools/ExportLegacy.gs</code> และนำเข้าเป็นลำดับทีละกลุ่ม โดยไม่ผ่าน Edge Function</p>
<div class="row g-2 mb-3"><div class="col-md-6"><label>Admin username</label><input id="user" class="form-control" autocomplete="username"></div><div class="col-md-6"><label>รหัสผ่าน</label><input id="pass" type="password" class="form-control"></div></div>
<button id="login" class="btn btn-primary mb-3">เข้าสู่ระบบผู้ดูแล</button><div id="stage" hidden><p>ตรวจสอบภาคเรียนปัจจุบันก่อนนำเข้า อย่านำเข้า JSON ของเทอมอื่นผิดเทอม</p>
<input type="file" id="upload" accept="application/json,.json" class="form-control mb-3"><button id="start" class="btn btn-success">เริ่มนำเข้า JSON</button></div>
<pre id="log" class="bg-light p-3 mt-3 rounded" aria-live="polite">ยังไม่เริ่ม</pre><a href="index.html">กลับหน้าเว็บหลัก</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="bridge.js"></script><script src="backend.js"></script>
<script>
const log=document.getElementById('log');function write(x){log.textContent+='\n'+x}
document.getElementById('login').onclick=async()=>{
 try{const v=await SKNBackend.invoke('checkLogin',[document.getElementById('user').value,document.getElementById('pass').value],'');
 if(!v.success||v.user.role!=='admin')throw Error('เฉพาะผู้ดูแล');document.getElementById('stage').hidden=false;log.textContent='เข้าสู่ระบบสำเร็จ: '+v.user.name;}
 catch(e){log.textContent='เข้าสู่ระบบไม่ได้: '+e.message;}
};
document.getElementById('start').onclick=async()=>{
 const f=document.getElementById('upload').files[0];if(!f)return alert('เลือกไฟล์ JSON ก่อน');
 const button=document.getElementById('start');button.disabled=true;
 try{const data=JSON.parse(await f.text());if(data.format!=='SKN-SHEET-EXPORT-V1'||!data.sheets)throw Error('ต้องใช้ JSON ที่ ExportLegacy.gs สร้าง');
 const methods=['Teachers','Students','Clubs','Registration','Attendance_Data','Club_Reports','Config'];
 log.textContent='เริ่มนำเข้า...';
 for(const name of methods){const entries=data.sheets[name]||[];write(name+': '+entries.length+' รายการ');
 for(let i=0;i<entries.length;i+=100){const batch=entries.slice(i,i+100);
 const out=await SKNBackend.invoke('importLegacyChunk',[name,batch],SKNBridge.periodId);
 if(!out?.success)throw Error(name+' ไม่สำเร็จ');write('  ✓ '+Math.min(i+100,entries.length)+' / '+entries.length);
 }}write('เสร็จสิ้น ตรวจสอบจำนวนสมาชิกและผลเช็กชื่อจากหน้าเว็บก่อนใช้งานจริง');}
 catch(e){write('หยุดนำเข้า: '+e.message)}finally{button.disabled=false;}
};
</script></body></html>
